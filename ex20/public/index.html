<!DOCTYPE html>
<html lang='pt-br'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Cadastro de Alunos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel='stylesheet' href='static/main.css'>
    <script defer src='static/main.js'></script>
</head>
<body>
    <header>
        <h1>Cadastro de alunos</h1>
    </header>

    <main>
        <section class='container'>
            <div class="header-main" >

            <button id='show-delete-btn' class='btn btn-warning'>Excluir todos os alunos</button>
            <button id='show-form-btn' class='btn btn-warning'>Cadastrar novo aluno</button>

            <div id='student-list' class='mt-4'></div>
            </div>
        </section>

        <section class="container">
            <div id="insert-alunos"></div>
        </section>

        <section class='container'>
            <form id='student-form' class='d-none'>
                <div class='mb-3'>
                    <label for='nome' class='form-label'>Nome:</label>
                    <input type='text' class='form-control' id='nome' required>
                </div>
                <div class='mb-3'>
                    <label for='turma' class='form-label'>Turma:</label>
                    <input type='text' class='form-control' id='turma' required>
                </div>
                <div class='mb-3'>
                    <label for='curso' class='form-label'>Curso:</label>
                    <input type='text' class='form-control' id='curso' required>
                </div>
                <button type='submit' class='btn btn-warning'>Cadastrar</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Cadastro de Alunos.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
